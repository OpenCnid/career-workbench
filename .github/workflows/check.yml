name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:clean-install
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm release:prepare
      - run: pnpm check:release
      - run: pnpm check:isolated
